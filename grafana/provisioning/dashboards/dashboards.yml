# =============================================
# Grafana Dashboard Provisioning
# Tự động load dashboard JSON từ thư mục /var/lib/grafana/dashboards
# =============================================

apiVersion: 1

providers:
  - name: "Default"
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
