# =============================================
# Nginx Reverse Proxy — TechViet Store
# HTTP : host 8081 → container 80
# HTTPS: host 8443 → container 443 (self-signed, demo)
# =============================================

# ---- Cấu hình dùng chung cho cả 2 server ----
# (đặt trong từng server vì Nginx không cho include dễ dàng ở đây)

# =============================================
# HTTP SERVER — http://localhost:8081
# =============================================
server {
    listen 80;
    server_name localhost 127.0.0.1;

    # Ẩn phiên bản Nginx trong header Server
    server_tokens off;

    # Docker DNS resolver — resolve tên service lúc runtime
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Giới hạn kích thước request (upload media trong WordPress)
    client_max_body_size 128M;
    client_body_timeout   60s;
    client_header_timeout 60s;
    send_timeout          120s;

    # Timeout proxy cho WordPress
    proxy_connect_timeout 60s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    # Buffering
    proxy_buffer_size       128k;
    proxy_buffers           4 256k;
    proxy_busy_buffers_size 256k;

    # ---- Security Headers ----
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy     "camera=(), microphone=(), geolocation=()" always;
    # blob: cần cho iframe canvas của Gutenberg và ảnh xem trước khi upload.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # ---- WordPress ----
    location / {
        # Dùng biến để Nginx resolve DNS lúc runtime (không phải lúc start)
        set $upstream_wordpress http://wordpress:80;
        proxy_pass $upstream_wordpress;

        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # Hỗ trợ WebSocket / admin-ajax
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Ẩn phiên bản PHP và header trùng từ WordPress.
        # Nginx đã tự thêm X-Frame-Options ở cấp server.
        proxy_hide_header X-Powered-By;
        proxy_hide_header X-Frame-Options;
    }

    # Healthcheck nội bộ cho Docker
    location = /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Chặn truy cập file ẩn (.env, .git, ...)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# =============================================
# HTTPS SERVER — https://localhost:8443
# Chứng chỉ tự ký cho môi trường demo/lab
# =============================================
server {
    listen 443 ssl;
    http2 on;
    server_name localhost 127.0.0.1;

    server_tokens off;

    ssl_certificate     /etc/nginx/ssl/selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/selfsigned.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    resolver 127.0.0.11 valid=30s ipv6=off;

    client_max_body_size 128M;
    client_body_timeout   60s;
    client_header_timeout 60s;
    send_timeout          120s;

    proxy_connect_timeout 60s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    proxy_buffer_size       128k;
    proxy_buffers           4 256k;
    proxy_busy_buffers_size 256k;

    # ---- Security Headers (thêm HSTS cho HTTPS) ----
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy     "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # blob: cần cho iframe canvas của Gutenberg và ảnh xem trước khi upload.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    location / {
        set $upstream_wordpress http://wordpress:80;
        proxy_pass $upstream_wordpress;

        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Ẩn phiên bản PHP và header trùng từ WordPress.
        # Nginx đã tự thêm X-Frame-Options ở cấp server.
        proxy_hide_header X-Powered-By;
        proxy_hide_header X-Frame-Options;
    }

    location = /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# =============================================
# INTERNAL SERVER — chỉ phục vụ stub_status cho exporter
# Cổng 8080 không được publish ra host (xem compose.yaml).
# =============================================
server {
    listen 8080;
    server_name localhost;

    server_tokens off;

    location = /nginx_status {
        stub_status;
        access_log off;
        # Chỉ cho phép dải IP nội bộ Docker
        allow 172.16.0.0/12;
        deny all;
    }
}
