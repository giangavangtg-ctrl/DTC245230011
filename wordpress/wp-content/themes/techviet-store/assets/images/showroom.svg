<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" width="760" height="600" role="img" aria-label="Cửa hàng TechViet Store tại Quận 7, TP. Hồ Chí Minh">
	<defs>
		<linearGradient id="mapBg" x1="0" y1="0" x2="760" y2="600" gradientUnits="userSpaceOnUse">
			<stop offset="0" stop-color="#eaf4ff"/>
			<stop offset="0.55" stop-color="#eef9fc"/>
			<stop offset="1" stop-color="#ddecfb"/>
		</linearGradient>
		<linearGradient id="storeFront" x1="140" y1="200" x2="620" y2="500" gradientUnits="userSpaceOnUse">
			<stop offset="0" stop-color="#ffffff"/>
			<stop offset="1" stop-color="#eef5fd"/>
		</linearGradient>
		<linearGradient id="storeGlass" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#0b63f6"/>
			<stop offset="0.6" stop-color="#0a8ef0"/>
			<stop offset="1" stop-color="#00c8d8"/>
		</linearGradient>
		<linearGradient id="pinGrad" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#ff8a2a"/>
			<stop offset="1" stop-color="#ff5f1a"/>
		</linearGradient>
		<filter id="mapShadow" x="-20%" y="-20%" width="140%" height="140%">
			<feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#15375f" flood-opacity="0.16"/>
		</filter>
	</defs>

	<rect width="760" height="600" fill="url(#mapBg)"/>

	<!-- Map grid -->
	<g opacity="0.5">
		<path d="M-40 210 320 -20M60 620 500 120M300 620 760 200M-20 430 420 40" stroke="#ffffff" stroke-width="20"/>
		<path d="M-40 210 320 -20M60 620 500 120M300 620 760 200M-20 430 420 40" stroke="#cfe3f5" stroke-width="2" stroke-dasharray="8 10"/>
		<path d="M0 90h760M0 520h760" stroke="#ffffff" stroke-width="10" opacity="0.6"/>
	</g>

	<circle cx="648" cy="104" r="88" fill="#ffffff" opacity="0.5"/>
	<circle cx="92" cy="512" r="70" fill="#ffffff" opacity="0.4"/>

	<!-- Storefront -->
	<g filter="url(#mapShadow)">
		<rect x="150" y="168" width="460" height="322" rx="18" fill="url(#storeFront)" stroke="#cfdff0" stroke-width="2"/>
		<rect x="168" y="186" width="424" height="64" rx="12" fill="#0b2a5c"/>
		<rect x="168" y="186" width="424" height="22" rx="11" fill="#0b63f6" opacity="0.35"/>
		<g transform="translate(196 202)">
			<rect width="34" height="34" rx="9" fill="#0b63f6"/>
			<path d="M20 6 10 20h6l-1 8 11-14h-6l1-8Z" fill="#ffffff"/>
			<text x="44" y="23" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="800" fill="#ffffff" letter-spacing="0.5">TechViet Store</text>
		</g>
		<text x="576" y="224" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#9fc4f5" letter-spacing="2">CÔNG NGHỆ CHÍNH HÃNG</text>

		<!-- Awning -->
		<g>
			<path d="M150 264h460l-20 42H170l-20-42Z" fill="#0b63f6"/>
			<path d="M170 264h50l-8 42h-38l-4-42Zm100 0h50l-4 42h-42l-4-42Zm100 0h50l-2 42h-44l-4-42Zm100 0h50l-2 42h-46l-2-42Z" fill="#ffffff" opacity="0.9"/>
		</g>

		<!-- Windows -->
		<rect x="178" y="326" width="164" height="138" rx="10" fill="#dfeefb" stroke="#c3d8ec" stroke-width="2"/>
		<rect x="190" y="338" width="140" height="86" rx="6" fill="url(#storeGlass)" opacity="0.82"/>
		<g opacity="0.9">
			<rect x="202" y="380" width="40" height="30" rx="4" fill="#ffffff" opacity="0.85"/>
			<rect x="251" y="368" width="26" height="42" rx="5" fill="#ffffff" opacity="0.7"/>
			<rect x="286" y="376" width="32" height="34" rx="4" fill="#ffffff" opacity="0.8"/>
		</g>
		<rect x="190" y="434" width="140" height="18" rx="4" fill="#cbe0f5"/>
		<rect x="238" y="434" width="44" height="18" rx="3" fill="#b6d2ee"/>

		<g transform="translate(410 326)">
			<rect width="156" height="138" rx="10" fill="#dfeefb" stroke="#c3d8ec" stroke-width="2"/>
			<rect x="12" y="12" width="132" height="114" rx="7" fill="url(#storeGlass)" opacity="0.9"/>
			<rect x="26" y="26" width="70" height="8" rx="4" fill="#ffffff" opacity="0.9"/>
			<rect x="26" y="42" width="46" height="5" rx="2.5" fill="#ffffff" opacity="0.55"/>
			<rect x="26" y="62" width="104" height="48" rx="8" fill="#ffffff" opacity="0.2"/>
			<circle cx="58" cy="86" r="12" fill="#ffffff" opacity="0.5"/>
			<path d="M40 104c10-14 18-4 28-10s10-10 20-6 12 10 22 6" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
		</g>

		<!-- Door -->
		<rect x="348" y="326" width="50" height="138" rx="8" fill="#cfe4f7" stroke="#b6d2ea" stroke-width="2"/>
		<rect x="356" y="336" width="34" height="118" rx="5" fill="#9fc8ea"/>
		<rect x="359" y="336" width="28" height="118" rx="4" fill="#0f3f78" opacity="0.8"/>
		<circle cx="380" cy="398" r="3" fill="#ffffff"/>

		<!-- Step -->
		<rect x="160" y="490" width="440" height="16" rx="8" fill="#c8d9ea"/>
		<rect x="140" y="506" width="480" height="12" rx="6" fill="#bccfe2"/>
	</g>

	<!-- Location pin -->
	<g filter="url(#mapShadow)">
		<path d="M648 108a46 46 0 0 1 46 46c0 34-46 82-46 82s-46-48-46-82a46 46 0 0 1 46-46Z" fill="url(#pinGrad)"/>
		<circle cx="648" cy="154" r="18" fill="#ffffff"/>
		<circle cx="648" cy="154" r="7" fill="#ff6a1a"/>
		<ellipse cx="648" cy="248" rx="24" ry="7" fill="#d4642a" opacity="0.25"/>
	</g>

	<!-- Contact tag -->
	<g filter="url(#mapShadow)">
		<rect x="84" y="420" width="208" height="86" rx="16" fill="#ffffff"/>
		<circle cx="114" cy="452" r="16" fill="#eef4ff"/>
		<path d="M108 452h12M114 446v12" stroke="#0b63f6" stroke-width="2.6" stroke-linecap="round"/>
		<text x="140" y="448" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#0b1424">123 Nguyễn Văn Linh</text>
		<text x="140" y="467" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#5b6b82">Quận 7, TP. Hồ Chí Minh</text>
		<text x="140" y="488" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#0b63f6">08:00 – 21:00 mỗi ngày</text>
	</g>
</svg>
