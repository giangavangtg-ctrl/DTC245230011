			<stop offset="1" stop-color="#d8e6fa"/>
		</linearGradient>
		<linearGradient id="kbBody" x1="90" y1="150" x2="630" y2="440" gradientUnits="userSpaceOnUse">
			<stop offset="0" stop-color="#25374f"/>
