<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 660" width="880" height="660" role="img" aria-label="Không gian cửa hàng TechViet Store">
	<defs>
		<linearGradient id="shopWall" x1="0" y1="0" x2="880" y2="520" gradientUnits="userSpaceOnUse">
			<stop offset="0" stop-color="#eaf3ff"/>
			<stop offset="0.55" stop-color="#f4f8ff"/>
			<stop offset="1" stop-color="#e3f4fb"/>
		</linearGradient>
		<linearGradient id="shopFloor" x1="0" y1="520" x2="0" y2="660" gradientUnits="userSpaceOnUse">
			<stop offset="0" stop-color="#dfe9f6"/>
			<stop offset="1" stop-color="#cfdcec"/>
		</linearGradient>
		<linearGradient id="shopAccent" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#0b63f6"/>
			<stop offset="1" stop-color="#00bfd8"/>
		</linearGradient>
		<linearGradient id="shopScreen" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#0b63f6"/>
			<stop offset="0.6" stop-color="#0a8ef0"/>
			<stop offset="1" stop-color="#45e0e8"/>
		</linearGradient>
		<filter id="shopShadow" x="-20%" y="-20%" width="140%" height="140%">
			<feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#14345c" flood-opacity="0.12"/>
		</filter>
	</defs>

	<rect width="880" height="660" rx="28" fill="url(#shopWall)"/>
	<rect y="520" width="880" height="140" rx="0" fill="url(#shopFloor)"/>
	<path d="M0 520h880" stroke="#c4d4e8" stroke-width="2"/>

	<!-- Wall panel + lighting -->
	<rect x="60" y="58" width="760" height="388" rx="20" fill="#ffffff" opacity="0.6"/>
	<g opacity="0.5" fill="#d9e9ff">
		<path d="M180 110 120 230h120L180 110Z" opacity="0.7"/>
		<path d="M440 110 380 230h120L440 110Z" opacity="0.7"/>
		<path d="M700 110 640 230h120L700 110Z" opacity="0.7"/>
	</g>
	<g fill="#ffe6a8" opacity="0.55">
		<ellipse cx="180" cy="100" rx="26" ry="10"/>
		<ellipse cx="440" cy="100" rx="26" ry="10"/>
		<ellipse cx="700" cy="100" rx="26" ry="10"/>
	</g>

	<!-- Logo wall -->
	<g transform="translate(352 76)">
		<rect width="176" height="46" rx="12" fill="url(#shopAccent)"/>
		<path d="M28 8 14 27h8l-2 11 15-20h-8l1-10Z" fill="#ffffff"/>
		<text x="58" y="29" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="800" fill="#ffffff" letter-spacing="0.5">TechViet</text>
	</g>

	<!-- Left shelf -->
	<g filter="url(#shopShadow)">
		<rect x="84" y="242" width="236" height="20" rx="6" fill="#c9d8ea"/>
		<rect x="84" y="358" width="236" height="20" rx="6" fill="#c9d8ea"/>
		<rect x="96" y="262" width="10" height="96" fill="#dfe8f4"/>
		<rect x="298" y="262" width="10" height="96" fill="#dfe8f4"/>
		<g>
			<rect x="110" y="284" width="52" height="44" rx="6" fill="#0f2038"/>
			<rect x="115" y="289" width="42" height="34" rx="3" fill="url(#shopScreen)" opacity="0.85"/>
			<rect x="172" y="296" width="42" height="32" rx="5" fill="#1a2d47"/>
			<rect x="176" y="300" width="34" height="24" rx="2" fill="#9fdcf0" opacity="0.7"/>
			<rect x="224" y="280" width="58" height="48" rx="6" fill="#ffffff" stroke="#d5e2f1"/>
			<rect x="232" y="288" width="42" height="32" rx="4" fill="#e4f0fd"/>
		</g>
		<g>
			<rect x="116" y="330" width="22" height="28" rx="5" fill="#22364f"/>
			<rect x="146" y="326" width="22" height="32" rx="5" fill="#31506f"/>
			<rect x="176" y="330" width="22" height="28" rx="5" fill="#22364f"/>
			<rect x="206" y="326" width="22" height="32" rx="5" fill="#00a6c4"/>
			<rect x="236" y="330" width="22" height="28" rx="5" fill="#22364f"/>
			<rect x="266" y="326" width="22" height="32" rx="5" fill="#31506f"/>
		</g>
		<g>
			<rect x="118" y="394" width="60" height="42" rx="6" fill="#ffffff" stroke="#d5e2f1"/>
			<rect x="126" y="402" width="44" height="26" rx="4" fill="#dcebfb"/>
			<rect x="190" y="398" width="46" height="38" rx="6" fill="#1a2d47"/>
			<rect x="196" y="404" width="34" height="26" rx="3" fill="#88d8e8" opacity="0.8"/>
			<rect x="248" y="390" width="44" height="46" rx="6" fill="#0f2038"/>
			<rect x="254" y="396" width="32" height="34" rx="3" fill="url(#shopScreen)" opacity="0.7"/>
		</g>
	</g>

	<!-- Right shelf -->
	<g filter="url(#shopShadow)">
		<rect x="560" y="242" width="236" height="20" rx="6" fill="#c9d8ea"/>
		<rect x="560" y="358" width="236" height="20" rx="6" fill="#c9d8ea"/>
		<rect x="572" y="262" width="10" height="96" fill="#dfe8f4"/>
		<rect x="774" y="262" width="10" height="96" fill="#dfe8f4"/>
		<g>
			<rect x="590" y="276" width="34" height="56" rx="7" fill="#1a2d47"/>
			<rect x="595" y="282" width="24" height="42" rx="4" fill="url(#shopScreen)" opacity="0.8"/>
			<rect x="634" y="282" width="34" height="50" rx="7" fill="#ffffff" stroke="#d5e2f1"/>
			<rect x="640" y="288" width="22" height="36" rx="3" fill="#e2effc"/>
			<rect x="678" y="276" width="34" height="56" rx="7" fill="#0e2038"/>
			<rect x="683" y="282" width="24" height="42" rx="4" fill="#7ce4e8" opacity="0.7"/>
			<rect x="722" y="286" width="52" height="46" rx="9" fill="#ffffff" stroke="#d5e2f1"/>
			<circle cx="736" cy="304" r="8" fill="#e4f0fd"/>
			<circle cx="756" cy="304" r="8" fill="#d6e9fb"/>
			<rect x="730" y="318" width="34" height="5" rx="2.5" fill="#c6d7ea"/>
		</g>
		<g>
			<rect x="590" y="380" width="72" height="56" rx="8" fill="#ffffff" stroke="#d5e2f1"/>
			<rect x="600" y="390" width="52" height="32" rx="4" fill="#deedfd"/>
			<rect x="678" y="386" width="44" height="50" rx="7" fill="#0f2038"/>
			<rect x="684" y="392" width="32" height="38" rx="3" fill="url(#shopScreen)" opacity="0.75"/>
			<rect x="736" y="390" width="42" height="46" rx="7" fill="#20364f"/>
			<rect x="742" y="396" width="30" height="34" rx="3" fill="#8adfea" opacity="0.7"/>
		</g>
	</g>

	<!-- Counter -->
	<g filter="url(#shopShadow)">
		<rect x="300" y="446" width="280" height="108" rx="16" fill="#ffffff"/>
		<rect x="300" y="446" width="280" height="26" rx="13" fill="#e8f1fd"/>
		<rect x="300" y="472" width="280" height="10" fill="#cfe0f4"/>
		<rect x="330" y="500" width="220" height="24" rx="8" fill="#eef5ff"/>
		<text x="440" y="517" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#5b7ea6" letter-spacing="3">TECHVIET STORE</text>
		<rect x="354" y="540" width="16" height="14" rx="4" fill="#d5e2f1"/>
		<rect x="510" y="540" width="16" height="14" rx="4" fill="#d5e2f1"/>
	</g>

	<!-- Staff -->
	<g>
		<circle cx="392" cy="386" r="25" fill="#f3c9a5"/>
		<path d="M362 424c4-18 16-26 30-26s26 8 30 26l4 32h-68l4-32Z" fill="url(#shopAccent)"/>
		<path d="M370 404c-6-12-2-26 10-30 2 12 10 20 24 22-4 10-18 16-34 8Z" fill="#2b3d55"/>
		<circle cx="490" cy="384" r="25" fill="#e8b98f"/>
		<path d="M460 424c4-18 16-26 30-26s26 8 30 26l4 32h-68l4-32Z" fill="#12335f"/>
		<path d="M468 402c-8-14-2-28 10-32 0 14 10 22 26 24-6 12-22 16-36 8Z" fill="#1d2b3d"/>
	</g>

	<!-- Plant -->
	<g>
		<path d="M786 470h54l-8 66h-38l-8-66Z" fill="#d8b08a"/>
		<path d="M812 466c-30-6-44-34-30-58 22 4 34 28 30 58Z" fill="#2f9e74"/>
		<path d="M814 466c26-10 34-40 18-60-20 8-26 34-18 60Z" fill="#3bb98a"/>
		<path d="M812 462c-2-30 12-50 32-56 8 26-8 50-32 56Z" fill="#49c99a"/>
	</g>
</svg>
