# =============================================
# Telegraf — Docker container metrics exporter
# =============================================
# Lý do dùng Telegraf thay cAdvisor:
# - cAdvisor v0.49.1 không đọc được cgroup/overlayfs của từng container
#   trên Docker Desktop (Windows/WSL2); chỉ trả về cgroup gốc "/".
# - Telegraf đọc số liệu qua Docker Engine API (docker.sock) nên hoạt động
#   đúng trên Docker Desktop và cung cấp CPU, RAM, network, trạng thái
#   cho từng container.
# =============================================

[agent]
  interval = "15s"
  flush_interval = "15s"
  omit_hostname = true

[[inputs.docker]]
  endpoint = "unix:///var/run/docker.sock"
  gather_services = false
  container_names = []
  timeout = "10s"
  perdevice = false
  total = true
  source_tag = false
  # Chỉ giữ label cần thiết để giảm cardinality (Docker Desktop gắn rất nhiều label)
  docker_label_include = ["com.docker.compose.service", "com.docker.compose.project"]

[[outputs.prometheus_client]]
  listen = ":9273"
  metric_version = 2
  expiration_interval = "60s"
