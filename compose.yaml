# =============================================
# compose.yaml — Docker Compose cho Đề 3: WordPress
# WordPress + MySQL + phpMyAdmin
# + Nginx (reverse proxy + security headers + HTTPS self-signed)
# + Prometheus + Grafana + Loki + Promtail + Telegraf + mysqld-exporter
# =============================================

name: de3-wordpress

# ==========================
# NAMED VOLUMES
# Dữ liệu được lưu trong Docker, không mất khi restart container
# ==========================
volumes:
  db_data:
    driver: local
  wordpress_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local
  # Lưu vị trí đọc log của Promtail để không đọc lại log cũ sau khi restart
  promtail_positions:
    driver: local

# ==========================
# NETWORKS
# Tách biệt mạng nội bộ (backend) và mạng có thể truy cập từ ngoài
# ==========================
networks:
  # Mạng nội bộ: WordPress <-> MySQL, phpMyAdmin <-> MySQL
  # internal: false — Docker Desktop DNS không hoạt động trong internal network trên Windows
  # Isolation đảm bảo bằng: MySQL không expose port ra host, chỉ backend containers mới connect được
  backend:
    driver: bridge
    internal: false
  # Mạng frontend: Nginx <-> WordPress
  frontend:
    driver: bridge
  # Mạng monitoring: Prometheus, Grafana, Loki, Promtail, Telegraf, exporters
  monitoring:
    driver: bridge

# ==========================
# SERVICES
# ==========================
services:

  # -----------------------------------
  # 0. WP-CLI (công cụ quản trị, chỉ chạy khi cần)
  # Không thuộc luồng khởi động mặc định — dùng profile "tools":
  #   docker compose --profile tools run --rm wpcli <lệnh wp>
  # Chạy bằng user www-data (33) và chỉ nối mạng backend tới MySQL.
  # -----------------------------------
  wpcli:
    image: wordpress:cli-2.11.0
    container_name: de3_wpcli
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: ${WORDPRESS_DB_HOST}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      WORDPRESS_TABLE_PREFIX: ${WORDPRESS_TABLE_PREFIX}
      HOME: /tmp
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - wordpress_data:/var/www/html
      - ./wordpress/wp-content/themes/techviet-store:/var/www/html/wp-content/themes/techviet-store:ro
      - ./wordpress/wp-content/plugins/techviet-core:/var/www/html/wp-content/plugins/techviet-core:ro
      - ./tools:/tools:ro
    networks:
      - backend
    user: "33:33"
    security_opt:
      - no-new-privileges:true

  # -----------------------------------
  # 1. MySQL Database
  # -----------------------------------
  db:
    image: mysql:8.0.40
    container_name: de3_mysql
    restart: unless-stopped

    # Chỉ kết nối mạng nội bộ — KHÔNG expose cổng ra máy host
    networks:
      - backend

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      # Timezone
      TZ: Asia/Ho_Chi_Minh

    volumes:
      - db_data:/var/lib/mysql

    # Healthcheck: kiểm tra MySQL đã sẵn sàng nhận kết nối
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost",
             "-u", "root", "--password=${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    # Tối ưu hiệu năng MySQL cho môi trường dev
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --max_allowed_packet=128M
      - --innodb-buffer-pool-size=256M

    security_opt:
      - no-new-privileges:true

  # -----------------------------------
  # 2. WordPress (Apache variant)
  # Dùng Apache để phục vụ HTTP nội bộ
  # Nginx làm reverse proxy phía trước (cổng 8081 / HTTPS 8443)
  # -----------------------------------
  wordpress:
    image: wordpress:6.7.2-apache
    container_name: de3_wordpress
    restart: unless-stopped

    networks:
      - backend
      - frontend

    # WordPress chỉ khởi động SAU KHI MySQL healthy
    depends_on:
      db:
        condition: service_healthy

    environment:
      WORDPRESS_DB_HOST: ${WORDPRESS_DB_HOST}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      WORDPRESS_TABLE_PREFIX: ${WORDPRESS_TABLE_PREFIX}
      WORDPRESS_DEBUG: ${WORDPRESS_DEBUG}
      TZ: Asia/Ho_Chi_Minh
      # Giúp WordPress tin tưởng X-Forwarded-Proto từ Nginx và tự sinh URL
      # đúng scheme/port khi truy cập qua HTTP (8081) hoặc HTTPS (8443).
      # Bỏ qua khi chạy WP-CLI (PHP_SAPI === 'cli') để CLI luôn dùng
      # siteurl/home lưu trong database.
      WORDPRESS_CONFIG_EXTRA: |
        if ( PHP_SAPI !== 'cli' && ! empty( $$_SERVER['HTTP_HOST'] ) ) {
          $$proto = ( isset( $$_SERVER['HTTP_X_FORWARDED_PROTO'] ) && 'https' === $$_SERVER['HTTP_X_FORWARDED_PROTO'] ) ? 'https' : 'http';
          if ( 'https' === $$proto ) {
            $$_SERVER['HTTPS'] = 'on';
          }
          define( 'WP_HOME', $$proto . '://' . $$_SERVER['HTTP_HOST'] );
          define( 'WP_SITEURL', $$proto . '://' . $$_SERVER['HTTP_HOST'] );
        }
        define( 'DISALLOW_FILE_EDIT', true );
        define( 'WP_AUTO_UPDATE_CORE', false );

    volumes:
      # Lưu toàn bộ file WordPress (themes, plugins, uploads)
      - wordpress_data:/var/www/html
      # Theme + plugin tự phát triển, được quản lý trong Git (read-only)
      - ./wordpress/wp-content/themes/techviet-store:/var/www/html/wp-content/themes/techviet-store:ro
      - ./wordpress/wp-content/plugins/techviet-core:/var/www/html/wp-content/plugins/techviet-core:ro

    # Không expose cổng WordPress trực tiếp ra host — mọi truy cập qua Nginx.
    # Khi cần debug có thể tạm thời bỏ comment mapping "127.0.0.1:8082:80".

    healthcheck:
      # Kiểm tra cả HTTP status VÀ nội dung: trang lỗi DB cũng trả HTTP 200
      test: ["CMD-SHELL", "html=$$(curl -fsS http://localhost/ 2>/dev/null || true); echo \"$$html\" | grep -qi 'Error establishing a database connection' && exit 1; echo \"$$html\" | grep -qi '<body' && exit 0; exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

    security_opt:
      - no-new-privileges:true

  # -----------------------------------
  # 3. phpMyAdmin — Quản lý cơ sở dữ liệu
  # Chỉ để quản trị, không để public
  # -----------------------------------
  phpmyadmin:
    image: phpmyadmin:5.2.2-apache
    container_name: de3_phpmyadmin
    restart: unless-stopped

    networks:
      - backend

    # phpMyAdmin chỉ khởi động sau MySQL
    depends_on:
      db:
        condition: service_healthy

    environment:
      PMA_HOST: ${PMA_HOST}
      PMA_PORT: ${PMA_PORT}
      # Giới hạn upload SQL file lên 512MB
      UPLOAD_LIMIT: 512M
      # Tắt thông báo "allow_nopassword_root"
      PMA_ARBITRARY: 0
      TZ: Asia/Ho_Chi_Minh

    # Chỉ bind localhost — dùng để quản trị, không public
    ports:
      - "127.0.0.1:8080:80"

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/ -o /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    security_opt:
      - no-new-privileges:true

  # -----------------------------------
  # 4. Nginx Reverse Proxy
  # Cổng host 8081 → WordPress container
  # -----------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: de3_nginx
    restart: unless-stopped

    networks:
      - frontend

    depends_on:
      wordpress:
        condition: service_healthy

    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro

    # Cổng 8080 chỉ dùng nội bộ cho nginx-prometheus-exporter (stub_status),
    # KHÔNG publish ra host.
    expose:
      - "8080"

    ports:
      - "127.0.0.1:8081:80"
      - "127.0.0.1:8443:443"

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/nginx-health -o /dev/null -s || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    security_opt:
      - no-new-privileges:true

  # -----------------------------------
  # 5. Prometheus — Thu thập metrics
  # -----------------------------------
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: de3_prometheus
    restart: unless-stopped

    networks:
      - monitoring

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    # Chỉ bind localhost — giao diện quản trị nội bộ
    ports:
      - "127.0.0.1:9090:9090"

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-lifecycle"

    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    security_opt:
      - no-new-privileges:true

  # -----------------------------------
  # 6. Grafana — Dashboard giám sát
  # -----------------------------------
  grafana:
    image: grafana/grafana:11.2.2
    container_name: de3_grafana
    restart: unless-stopped

    networks:
      - monitoring

    depends_on:
      prometheus:
        condition: service_healthy

    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "http://localhost:3000"
      TZ: Asia/Ho_Chi_Minh

    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro

    # Chỉ bind localhost
    ports:
      - "127.0.0.1:3000:3000"

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health -o /dev/null -s || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    security_opt:
      - no-new-privileges:true

  # -----------------------------------
  # 7. Loki — Log aggregation
  # -----------------------------------
  loki:
    image: grafana/loki:3.2.0
    container_name: de3_loki
    restart: unless-stopped

    networks:
      - monitoring

    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki

    # Chỉ bind localhost
    ports:
      - "127.0.0.1:3100:3100"

    command: -config.file=/etc/loki/loki-config.yml

    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

    security_opt:
      - no-new-privileges:true

  # -----------------------------------
  # 8. Promtail — Thu thập log container
  # -----------------------------------
  promtail:
    image: grafana/promtail:3.2.0
    container_name: de3_promtail
    restart: unless-stopped

    networks:
      - monitoring

    depends_on:
      loki:
        condition: service_healthy

    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      # Lưu vị trí đọc log để restart không đọc lại log cũ (tránh lỗi
      # "entry too far behind" từ Loki)
      - promtail_positions:/var/lib/promtail
      # Mount Docker socket để đọc log container
      # Trên Docker Desktop for Windows, socket được expose tại đường dẫn này
      - /var/run/docker.sock:/var/run/docker.sock:ro

    command: -config.file=/etc/promtail/promtail-config.yml

    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:9080/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    security_opt:
      - no-new-privileges:true

  # -----------------------------------
  # 9. Telegraf — Container metrics exporter
  # Thu thập CPU, RAM, Network, trạng thái của từng container
  # qua Docker Engine API, expose Prometheus metrics tại :9273.
  # -----------------------------------
  # LƯU Ý WINDOWS / DOCKER DESKTOP:
  # - cAdvisor v0.49.1 chỉ đọc được cgroup gốc "/" và không nhận diện
  #   được container do khác biệt overlayfs/cgroup của Docker Desktop.
  #   Vì vậy Telegraf được dùng thay thế: nó đọc Docker API nên hoạt động
  #   ổn định trên cả Linux và Docker Desktop.
  # - Tiến trình chạy bằng root để đọc được /var/run/docker.sock (socket
  #   thuộc root:root trong container trên Docker Desktop). Socket chỉ
  #   được mount read-only và bật no-new-privileges.
  # - Không công khai cổng 9273 — Prometheus truy cập qua network monitoring.
  docker-metrics:
    image: telegraf:1.31
    container_name: de3_docker_metrics
    restart: unless-stopped

    networks:
      - monitoring

    user: "0:0"
    entrypoint: ["/usr/bin/telegraf", "--config", "/etc/telegraf/telegraf.conf"]

    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:9273/metrics || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    security_opt:
      - no-new-privileges:true

  # -----------------------------------
  # 10. mysqld-exporter — Giám sát MySQL cho Prometheus
  # -----------------------------------
  mysqld-exporter:
    image: prom/mysqld-exporter:v0.14.0
    container_name: de3_mysqld_exporter
    restart: unless-stopped

    networks:
      - backend
      - monitoring

    depends_on:
      db:
        condition: service_healthy

    environment:
      # mysqld-exporter v0.14.0 sử dụng DATA_SOURCE_NAME.
      # Dùng user riêng chỉ có quyền đọc (PROCESS, REPLICATION CLIENT,
      # SELECT trên performance_schema) thay vì tài khoản WordPress.
      DATA_SOURCE_NAME: "${MYSQL_EXPORTER_USER}:${MYSQL_EXPORTER_PASSWORD}@(db:3306)/"

    command:
      - "--collect.global_status"
      - "--collect.global_variables"
      - "--collect.info_schema.innodb_metrics"

    security_opt:
      - no-new-privileges:true

    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:9104/metrics || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # -----------------------------------
  # 11. nginx-prometheus-exporter — Metrics Nginx cho Prometheus
  # Đọc endpoint /nginx_status (stub_status) qua mạng frontend
  # -----------------------------------
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    container_name: de3_nginx_exporter
    restart: unless-stopped

    networks:
      - frontend
      - monitoring

    depends_on:
      nginx:
        condition: service_healthy

    command:
      - "--nginx.scrape-uri=http://nginx:8080/nginx_status"

    # Image distroless không có wget/curl nên không đặt healthcheck tại đây.
    # Trạng thái thật được xác minh qua Prometheus target "nginx" (UP)
    # và endpoint http://nginx-exporter:9113/metrics.
    security_opt:
      - no-new-privileges:true
